<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <title>Dalia</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A0FA8"/>
      <stop offset=".55" stop-color="#290087"/>
      <stop offset="1" stop-color="#16004A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".52" r=".5">
      <stop offset="0" stop-color="#A230A4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A230A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7A1F86"/>
      <stop offset="1" stop-color="#C255C4"/>
    </linearGradient>
    <linearGradient id="pMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9E7FE0"/>
      <stop offset="1" stop-color="#DAD4F2"/>
    </linearGradient>
    <linearGradient id="pIn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F2E0A4"/>
      <stop offset="1" stop-color="#FFF8DD"/>
    </linearGradient>
    <path id="outer" d="M0 0C-74 -70 -86 -232 0 -322C86 -232 74 -70 0 0Z"/>
    <path id="mid" d="M0 0C-58 -58 -66 -178 0 -246C66 -178 58 -58 0 0Z"/>
    <path id="in" d="M0 0C-40 -40 -44 -116 0 -160C44 -116 40 -40 0 0Z"/>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <circle cx="512" cy="530" r="430" fill="url(#glow)"/>
  <g transform="translate(512 522) scale(1.1)">
    <g fill="url(#pOuter)" stroke="#5B1468" stroke-opacity=".35" stroke-width="4">
      <use xlink:href="#outer"/><use xlink:href="#outer" transform="rotate(30)"/><use xlink:href="#outer" transform="rotate(60)"/>
      <use xlink:href="#outer" transform="rotate(90)"/><use xlink:href="#outer" transform="rotate(120)"/><use xlink:href="#outer" transform="rotate(150)"/>
      <use xlink:href="#outer" transform="rotate(180)"/><use xlink:href="#outer" transform="rotate(210)"/><use xlink:href="#outer" transform="rotate(240)"/>
      <use xlink:href="#outer" transform="rotate(270)"/><use xlink:href="#outer" transform="rotate(300)"/><use xlink:href="#outer" transform="rotate(330)"/>
    </g>
    <g fill="url(#pMid)" stroke="#6A4CC0" stroke-opacity=".35" stroke-width="4">
      <use xlink:href="#mid" transform="rotate(15)"/><use xlink:href="#mid" transform="rotate(45)"/><use xlink:href="#mid" transform="rotate(75)"/>
      <use xlink:href="#mid" transform="rotate(105)"/><use xlink:href="#mid" transform="rotate(135)"/><use xlink:href="#mid" transform="rotate(165)"/>
      <use xlink:href="#mid" transform="rotate(195)"/><use xlink:href="#mid" transform="rotate(225)"/><use xlink:href="#mid" transform="rotate(255)"/>
      <use xlink:href="#mid" transform="rotate(285)"/><use xlink:href="#mid" transform="rotate(315)"/><use xlink:href="#mid" transform="rotate(345)"/>
    </g>
    <g fill="url(#pIn)" stroke="#C9A64A" stroke-opacity=".4" stroke-width="3">
      <use xlink:href="#in"/><use xlink:href="#in" transform="rotate(45)"/><use xlink:href="#in" transform="rotate(90)"/><use xlink:href="#in" transform="rotate(135)"/>
      <use xlink:href="#in" transform="rotate(180)"/><use xlink:href="#in" transform="rotate(225)"/><use xlink:href="#in" transform="rotate(270)"/><use xlink:href="#in" transform="rotate(315)"/>
    </g>
    <circle r="62" fill="#290087"/>
    <circle r="62" fill="none" stroke="#F2E0A4" stroke-width="8"/>
    <!-- friendly face: Dalia is a companion, not a machine -->
    <circle cx="-21" cy="-8" r="9" fill="#F6FFE9"/>
    <circle cx="21" cy="-8" r="9" fill="#F6FFE9"/>
    <path d="M-22 16Q0 34 22 16" fill="none" stroke="#F6FFE9" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- sparkle -->
  <path d="M850 112C857 162 873 178 923 185C873 192 857 208 850 258C843 208 827 192 777 185C827 178 843 162 850 112Z" fill="#F2E0A4"/>
  <path d="M170 806C175 836 184 845 214 850C184 855 175 864 170 894C165 864 156 855 126 850C156 845 165 836 170 806Z" fill="#CAC5E5" opacity=".85"/>
</svg>
