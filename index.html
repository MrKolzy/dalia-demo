<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dalia prototype</title>
<meta name="description" content="Dalia: AI voice calendar for people with mild cognitive impairment. Working prototype by Team NuVoLa Rx (DETECT 2.0 Hackathon 2). Synthetic data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600&display=swap">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="assets/icon.svg" alt="" width="58" height="58">
      <div>
        <h1>Dalia</h1>
        <p data-i="tagline"></p>
      </div>
    </div>
    <div class="ai-box">
      <span class="ai-status" id="aiStatus"><i></i><span id="aiStatusTxt"></span></span>
    </div>
  </header>


  <section class="demo" aria-label="Demo controls">
    <div class="grp"><span class="lbl" data-i="simTime"></span><span class="clock" id="demoClock"></span>
      <button type="button" class="chip time" id="plus15">+15 min</button><button type="button" class="chip time" id="plus60">+1 h</button></div>
    <div class="grp"><span class="lbl" data-i="useCases"></span>
      <button type="button" class="chip sc" data-sc="1" data-i="sc1"></button>
      <button type="button" class="chip sc" data-sc="2" data-i="sc2"></button>
      <button type="button" class="chip sc" data-sc="3" data-i="sc3"></button>
      <button type="button" class="chip sc" data-sc="4" data-i="sc4"></button>
      <button type="button" class="chip sc" data-sc="5" data-i="sc5"></button></div>
    <span class="spacer"></span>
    <div class="grp">
      <button type="button" class="chip" data-lang="en">EN</button><button type="button" class="chip" data-lang="es">ES</button>
      <button type="button" class="chip" id="premiumBtn" aria-pressed="false"></button>
      <button type="button" class="chip" id="voiceBtn"></button>
      <select class="chip-select" id="voiceSel" aria-label="Voice"></select>
      <button type="button" class="chip" id="resetBtn" data-i="reset"></button></div>
  </section>

  <main class="stage">
    <div class="col">
      <div class="role" data-i="roleCarmen"></div>
      <div class="device tablet" id="tablet">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i="tabToday"></span></button>
          <button type="button" role="tab" data-tab="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span data-i="tabPrivacy"></span></button>
        </div>
        <div class="tbody" id="tabletBody" aria-live="polite"></div>
        <form class="talk" id="carmenForm">
          <div class="talkrow">
            <input id="carmenInput" autocomplete="off" data-ph="carmenPh">
            <button type="button" class="mic" id="micBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-i="speak"></span></button>
            <button type="submit"><span data-i="say"></span></button>
          </div>
          <div class="hints" id="carmenHints"></div>
          <button type="button" class="chip mic-perm" id="micPerm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-i="micEnable"></span></button>
          <div class="note" id="micNote"></div>
        </form>
        <div class="alarm" id="alarm" role="alertdialog" aria-modal="true" aria-live="assertive" hidden></div>
      </div>
    </div>

    <div class="col">
      <div class="role" data-i="roleLaura"></div>
      <div class="device phone">
        <div class="notch" aria-hidden="true"></div>
        <div class="p-head"><div id="lauraWho"></div><h3 id="phoneTitle"></h3><div class="p-status" id="pStatus"></div></div>
        <div class="p-tabs" role="tablist">
          <button type="button" role="tab" data-ptab="feed" data-i="pTabFeed"></button>
          <button type="button" role="tab" data-ptab="cal" data-i="pTabCal"></button>
          <button type="button" role="tab" data-ptab="add" data-i="pTabAdd"></button>
        </div>
        <ul class="feed p-pane" id="feed" aria-live="polite"></ul>
        <div class="p-cal p-pane" id="pCal" hidden></div>
        <form class="p-add p-pane" id="lauraForm" novalidate hidden>
          <div class="quick">
            <label for="lauraInput" data-i="quickLabel"></label>
            <div class="talkrow"><input id="lauraInput" autocomplete="off" data-ph="lauraPh"><button type="button" id="fillBtn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg><span data-i="fill"></span></button></div>
            <div class="hints" id="lauraHints"></div>
          </div>
          <div class="fields">
            <label class="fld"><span data-i="fWhat"></span><input id="fTitle" maxlength="40" autocomplete="off"></label>
            <div class="fld2">
              <label class="fld"><span data-i="fDay"></span><select id="fDay"></select></label>
              <label class="fld"><span data-i="fTime"></span><input id="fTime" type="time"></label>
            </div>
            <label class="fld"><span data-i="fPlace"></span><input id="fPlace" maxlength="40" autocomplete="off" data-ph="fPlacePh"></label>
            <div class="fld2">
              <label class="fld"><span data-i="fBefore"></span><select id="fBefore"></select></label>
              <label class="fld"><span data-i="fFor"></span><select id="fFor"></select></label>
            </div>
            <label class="chk" id="fSupRow"><input type="checkbox" id="fSup"><span data-i="fSup"></span></label>
            <div id="fSuggest"></div>
          </div>
          <button type="submit" class="btn pri create" id="createBtn" data-i="create"></button>
          <div id="lauraResult"></div>
        </form>
      </div>
      <section class="panel">
        <h3><span class="hi"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg></span><span data-i="aiTitle"></span></h3>
        <div id="aiPanel"></div>
        <div class="sub" data-i="neverTitle"></div>
        <ul class="never"><li data-i="never1"></li><li data-i="never2"></li><li data-i="never3"></li><li data-i="never4"></li></ul>
      </section>
    </div>

    <div class="col side">
      <div class="col">
        <div class="role" data-i="roleNurse"></div>
        <div class="device nurse-dev" id="nurse"></div>
      </div>
      <section class="panel" id="learned"></section>
      <section class="panel">
        <h3><span class="hi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4v-5h4v-5h4V5h4"/></svg></span><span data-i="ladderTitle"></span></h3>
        <ol class="ladder" id="ladder"></ol>
      </section>
    </div>
  </main>

  <footer>
    <span>Team NuVoLa Rx · Layra Carbajal · Xavi Choro · Voro Climent · Robert Diaconu · Nuria Sánchez · Universitat Politècnica de València</span>
    <span data-i="footNote"></span>
  </footer>
</div>
<script src="assets/ai.js"></script>
<script src="assets/stt.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
